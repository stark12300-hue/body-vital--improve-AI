<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>
  
  <!-- Dumbbell & Lightning Icon -->
  <g transform="translate(106, 106)" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Barbell Left Weight -->
    <rect x="20" y="70" width="30" height="160" rx="12" fill="url(#accentGrad)"/>
    <rect x="55" y="90" width="22" height="120" rx="8" fill="url(#accentGrad)"/>
    
    <!-- Central Bar -->
    <line x1="77" y1="150" x2="223" y2="150" stroke="#f8fafc" stroke-width="22"/>
    <rect x="110" y="136" width="80" height="28" rx="6" fill="#3b82f6" opacity="0.8"/>
    
    <!-- Barbell Right Weight -->
    <rect x="223" y="90" width="22" height="120" rx="8" fill="url(#accentGrad)"/>
    <rect x="250" y="70" width="30" height="160" rx="12" fill="url(#accentGrad)"/>
    
    <!-- Sparkles / Star at top right -->
    <polygon points="250,20 258,38 276,46 258,54 250,72 242,54 224,46 242,38" fill="#10b981" stroke="none"/>
  </g>
</svg>
